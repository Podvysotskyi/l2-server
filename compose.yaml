name: l2-server

x-dotnet-environment: &dotnet-environment
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://+:8080
  ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=${POSTGRES_DB:-l2web};Username=${POSTGRES_USER:-l2web};Password=${POSTGRES_PASSWORD:-l2web_dev}

x-dotnet-healthcheck: &dotnet-healthcheck
  test:
    ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8080/health/ready']
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-l2web}
      POSTGRES_USER: ${POSTGRES_USER:-l2web}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-l2web_dev}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  login-server:
    image: ${L2_LOGIN_SERVER_IMAGE:-l2-server-login:dev}
    build:
      context: ${L2_SERVER_ROOT:-.}
      dockerfile: docker/dotnet.Dockerfile
      args:
        PROJECT: src/L2.LoginServer/L2.LoginServer.csproj
    command: ['L2.LoginServer.dll']
    environment: *dotnet-environment
    ports: ['127.0.0.1:5001:8080']
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck
    restart: unless-stopped

  game-server:
    image: ${L2_GAME_SERVER_IMAGE:-l2-server-game:dev}
    build:
      context: ${L2_SERVER_ROOT:-.}
      dockerfile: docker/dotnet.Dockerfile
      args:
        PROJECT: src/L2.GameServer/L2.GameServer.csproj
    command: ['L2.GameServer.dll']
    environment: *dotnet-environment
    ports: ['127.0.0.1:5002:8080']
    depends_on:
      login-server:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck
    restart: unless-stopped

volumes:
  postgres-data:
