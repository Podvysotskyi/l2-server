name: l2-server-e2e

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: l2web_e2e
      POSTGRES_USER: l2web_e2e
      POSTGRES_PASSWORD: l2web_e2e_dev
    ports: ['127.0.0.1:15432:5432']
    tmpfs: ['/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U l2web_e2e -d l2web_e2e']
      interval: 2s
      timeout: 3s
      retries: 20
