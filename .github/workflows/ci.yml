name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.102
      - run: dotnet restore
      - run: dotnet build L2.Server.slnx --no-restore
      - run: dotnet test L2.Server.slnx --no-build --no-restore
