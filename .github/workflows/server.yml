name: Server

on:
  pull_request:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - Dockerfile
      - .dockerignore
      - global.json
      - Directory.Build.props
      - Directory.Packages.props
      - NuGet.Config
      - L2.Server.slnx
      - .github/workflows/server.yml
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - src/**
      - tests/**
      - Dockerfile
      - .dockerignore
      - global.json
      - Directory.Build.props
      - Directory.Packages.props
      - NuGet.Config
      - L2.Server.slnx
      - .github/workflows/server.yml
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Run checks and build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: validate
          push: false
          cache-from: type=gha,scope=l2-server
          cache-to: type=gha,mode=max,scope=l2-server

  publish:
    name: Publish ${{ matrix.name }}
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: Server API
            target: api-production
            image: ghcr.io/podvysotskyi/l2-server-api
            cache: l2-server-api
          - name: Chronicle 1 Game Server
            target: game-c1-production
            image: ghcr.io/podvysotskyi/l2-game-server-c1
            cache: l2-game-server-c1
          - name: Chronicle 4 Game Server
            target: game-c4-production
            image: ghcr.io/podvysotskyi/l2-game-server-c4
            cache: l2-game-server-c4
          - name: Interlude Game Server
            target: game-interlude-production
            image: ghcr.io/podvysotskyi/l2-game-server-interlude
            cache: l2-game-server-interlude
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}
